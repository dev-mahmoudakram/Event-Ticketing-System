; PHP overrides for this document root.
;
; Read by PHP-FPM and CGI/FastCGI (which is how Plesk serves PHP), letting the reel video
; upload ceiling in config/media.php actually be reachable. Without these, PHP discards a
; clip larger than the server default before the request ever reaches Laravel, and the
; upload fails with no useful explanation.
;
; post_max_size covers the entire request body, so it must stay above upload_max_filesize.
; Changes here can take a few minutes to apply — PHP caches .user.ini per user_ini.cache_ttl
; (300 seconds by default).
;
; These are ignored under mod_php; if the host runs that, set the same values in Plesk's
; PHP Settings instead.

upload_max_filesize = 25M
post_max_size = 30M

; A 25 MB upload over a slow connection needs longer than the usual 60s to arrive.
max_input_time = 300
